services:
  - type: web
    runtime: node
    name: sea-market-research
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_NOTIFICATION_TO
        value: websiteinquiries@sagasiaconsulting.com
      - key: CONTACT_NOTIFICATION_FROM
        value: "SEA Market Research Website <websiteinquiries@sagasiaconsulting.com>"
